        perk: "내 의견을 찰떡같이 알아듣고 서포트해주는 든든한 백업 지원 🛡️",

        description: "타인을 배려하며 지시를 잘 이행하는 든든한 조력자입니다. 눈에 띄게 나서지는 않지만, 안정적으로 참여하여 프로젝트가 부드럽게 굴러가게 합니다.",

          "불만이 있어도 겉으로 잘 드러내지 않아요. 1대1로 편안하게 물어봐 주시면 속마음을 얘기할게요."

    function App() {
      const [step, setStep] = useState('intro');
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [isCapturing, setIsCapturing] = useState(false);
      const [isTransitioning, setIsTransitioning] = useState(false);
      
      const [name, setName] = useState('');
      
      const [selectedAnswers, setSelectedAnswers] = useState(Array(QUESTIONS.length).fill(null));
      
      const [showReview, setShowReview] = useState(false);
      const [showSecondaryModal, setShowSecondaryModal] = useState(false);
      const [showAllTypesModal, setShowAllTypesModal] = useState(false); 

      useEffect(() => {
        if (step === 'result' && window.confetti) {
          window.confetti({
            particleCount: 150,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#6366f1', '#ec4899', '#3b82f6', '#eab308', '#22c55e']
          });
        }
      }, [step]);

      const handleStart = () => {
        setStep('test');
        setCurrentQuestion(0);
        setSelectedAnswers(Array(QUESTIONS.length).fill(null)); 
        setShowReview(false);
        setShowSecondaryModal(false);
        setShowAllTypesModal(false); 
        setIsTransitioning(false);
      };

      const handleAnswer = (answerObj) => {
        if (isTransitioning) return;
        setIsTransitioning(true);

        const newAnswers = [...selectedAnswers];
        newAnswers[currentQuestion] = answerObj;
        setSelectedAnswers(newAnswers);

        if (currentQuestion < QUESTIONS.length - 1) {
          setTimeout(() => {
            setCurrentQuestion(prev => prev + 1);
            setIsTransitioning(false);
          }, 150);
        } else {
          setTimeout(() => {
            setStep('result');
            setIsTransitioning(false);
          }, 400);
        }
      };

      const handlePrev = () => {
        if (isTransitioning) return;
        if (currentQuestion > 0) {
          setCurrentQuestion(prev => prev - 1);
        }
      };

      const handleNext = () => {
        if (isTransitioning) return;
        if (selectedAnswers[currentQuestion]) {
          if (currentQuestion < QUESTIONS.length - 1) {
            setCurrentQuestion(prev => prev + 1);
          } else {
            setStep('result');
          }
        }
      };

      const calculateScores = () => {
        const s = { CP: 0, NP: 0, A: 0, FC: 0, AC: 0 };
        selectedAnswers.forEach((ans, idx) => {
          if (ans) {
            const cat = QUESTIONS[idx].category;
            s[cat] += ans.score;
          }
        });
        return s;
      };

      const getRankedTraits = (scoresData) => {
        const sorted = Object.entries(scoresData).sort((a, b) => b[1] - a[1]);
        return {
          primary: sorted[0][0],   
          secondary: sorted[1][0]  
        };
      };

      const handleCapture = async () => {
        if (!window.html2canvas) {
          alert("캡쳐 기능을 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
          return;
        }
        
        const captureArea = document.getElementById('result-capture-area');
        if (captureArea) {
          setIsCapturing(true);
          try {
            await new Promise(resolve => setTimeout(resolve, 500));
            
            const canvas = await window.html2canvas(captureArea, {
              scale: 2, 
              backgroundColor: '#f3f4f6', 
              windowWidth: 1024, 
              useCORS: true, 
              logging: false,
              onclone: (clonedDoc) => {
                const el = clonedDoc.getElementById('result-capture-area');
                if (el) {
                  el.style.width = '896px';
                  el.style.minWidth = '896px';
                  el.style.margin = '0 auto';
                }
              }
            });
            
            const image = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.href = image;
            const safeName = name.trim() ? `${name.trim()}_에고그램` : `나의_팀워크_에고그램`;
            link.download = `${safeName}.png`;
            link.click();
          } catch (error) {
            console.error("캡쳐 오류:", error);
            alert("이미지 캡쳐에 실패했습니다.");
          } finally {
            setIsCapturing(false);
          }
        }
      };

      const renderIntro = () => (
        <div className="flex flex-col items-center justify-center text-center animate-fade-in space-y-6 py-8 w-full">
          <div className="bg-indigo-100 p-5 rounded-full mb-2 shadow-inner">
            <IconUsers className="w-16 h-16 text-indigo-600" />
          </div>
          <h1 className="text-4xl sm:text-5xl font-extrabold text-gray-800 break-keep leading-tight">
            에고그램 테스트
          </h1>
          <p className="text-gray-600 mb-4 max-w-md break-keep leading-relaxed px-4">
            총 30개의 질문으로 나의 팀 내 포지션과 소통 꿀팁, 그리고 케미를 알아봅니다.
          </p>
          
          <div className="w-full max-w-xs mt-2 mb-2">
            <input
              type="text"
              placeholder="이름 입력 (선택사항)"
              value={name}
              onChange={(e) => setName(e.target.value)}
              className="w-full px-5 py-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center font-semibold text-gray-700 bg-white shadow-inner placeholder-gray-400 transition"
              maxLength="10"
            />
          </div>

          <button 
            onClick={handleStart}
            className="w-full max-w-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-2xl shadow-xl shadow-indigo-200 transition transform hover:-translate-y-1 hover:scale-105 flex items-center justify-center gap-2 text-lg mt-2"

            테스트 시작하기 <IconArrowRight className="w-5 h-5" />
          </button>
        </div>
      );

      const renderTest = () => {
        const question = QUESTIONS[currentQuestion];
        if (!question) return null;

        const progress = ((currentQuestion + 1) / QUESTIONS.length) * 100;
        
        return (
          <div className="w-full max-w-md animate-fade-in flex flex-col h-full justify-between py-2">
            <div className="space-y-6">
              
              <div className="space-y-2 px-2">
                <div className="flex justify-between text-sm font-bold text-indigo-500 items-center">
                  <button 
                    onClick={handlePrev} 
                    disabled={currentQuestion === 0} 
                    className={`p-1.5 rounded-lg transition ${currentQuestion === 0 ? 'text-gray-300 cursor-not-allowed' : 'text-indigo-600 hover:bg-indigo-100'}`}
                    title="이전 문항"
                  >
                    <IconChevronLeft className="w-5 h-5" />
                  </button>
                  <span>{currentQuestion + 1} <span className="text-gray-400 font-medium">/ {QUESTIONS.length}</span></span>
                  <button 
                    onClick={handleNext} 
                    disabled={!selectedAnswers[currentQuestion]} 
                    className={`p-1.5 rounded-lg transition ${!selectedAnswers[currentQuestion] ? 'text-gray-300 cursor-not-allowed' : 'text-indigo-600 hover:bg-indigo-100'}`}
                    title="다음 문항"
                  >
                    <IconChevronRight className="w-5 h-5" />
                  </button>
                </div>
                <div className="w-full bg-indigo-100 rounded-full h-3">
                  <div 
                    className="bg-indigo-500 h-3 rounded-full transition-all duration-300 ease-out" 
                    style={{ width: `${progress}%` }}
                  ></div>
                </div>
              </div>

              <div className="bg-white rounded-3xl shadow-md border border-indigo-50 p-8 min-h-[180px] flex items-center justify-center text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-1 bg-indigo-500 opacity-20"></div>
                <h2 className="text-xl font-bold text-gray-800 break-keep leading-relaxed relative z-10">
                  <span className="text-indigo-300 text-4xl absolute -top-4 -left-4 opacity-50">"</span>
                  {question.text}
                  <span className="text-indigo-300 text-4xl absolute -bottom-6 -right-4 opacity-50">"</span>
                </h2>
              </div>
            </div>

            <div className="space-y-3 mt-8">
              {ANSWERS.map((answer, idx) => {
                const isSelected = selectedAnswers[currentQuestion]?.score === answer.score;
                
                return (
                  <button
                    key={idx}
                    onClick={() => handleAnswer(answer)}
                    disabled={isTransitioning}
                    className={`w-full font-bold py-4 px-6 rounded-2xl transition-all duration-200 flex justify-center text-lg active:scale-[0.98] shadow-sm ${
                      isTransitioning 
                      ? 'bg-gray-50 text-gray-400 border border-gray-100 cursor-not-allowed shadow-none' 
                      : isSelected
                        ? 'bg-indigo-50 border border-indigo-400 text-indigo-700 ring-2 ring-indigo-300'
                        : 'bg-white hover:bg-indigo-50 border border-gray-200 hover:border-indigo-300 text-gray-700 hover:text-indigo-700'
                    }`}
                  >
                    {answer.text}
                  </button>
                );
              })}
            </div>
          </div>
        );
      };

      const renderResult = () => {
        const finalScores = calculateScores();
        const { primary, secondary } = getRankedTraits(finalScores);
        const resultData = RESULTS[primary];
        const secondaryData = RESULTS[secondary]; 
        
        const primaryScore = finalScores[primary];
        const secondaryScore = finalScores[secondary];
        
        const displayName = name.trim() ? `${name.trim()}님` : '당신';

        return (
          <div className="w-full flex flex-col items-center animate-fade-in pb-4">
            
            <div id="result-capture-area" className="w-full flex flex-col items-center bg-gray-100 p-4 sm:p-8 rounded-[2.5rem]">
              <h2 className="text-gray-500 font-bold mb-6 text-center text-sm tracking-wider bg-white px-5 py-2.5 rounded-full shadow-sm">
                <span className="text-indigo-600 font-extrabold">{displayName}</span>의 팀 프로젝트 캐릭터는

                {/* 좌측 패널 */}

                    <div className="flex justify-center mb-6">
                      <div className={`p-6 rounded-3xl ${resultData.color} bg-opacity-10 shadow-inner relative`}>

                      </div>

                    <h1 className="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-4 text-center break-keep leading-tight">
                      {resultData.title}

                      {resultData.hashtags.map((tag, idx) => (
                         <span key={idx} className="text-[12px] font-bold px-3 py-1 rounded-full bg-gray-50 text-gray-600 border border-gray-200">

                      ))}
                    </div>

                      <div className="inline-flex items-center gap-2 bg-gray-50 border border-gray-100 px-5 py-2.5 rounded-full">
                        <IconMessageCircle className="w-4 h-4 text-gray-500" />
                        <span className="text-[13px] font-semibold text-gray-700">말버릇: <span className="text-indigo-600">"{resultData.catchphrase}"</span></span>
                      </div>
                    </div>

                    <div className="bg-indigo-50 text-indigo-900 px-5 py-4 rounded-2xl mb-5 border border-indigo-100 text-sm font-bold text-center">
                      🎯 추천 역할 : <span className="text-indigo-600">{resultData.pblRole}</span>
                    </div>

                    {/* ✨ 1번 추가: 숨겨진 슈퍼파워 */}
                    <div className="bg-gradient-to-r from-gray-50 to-white text-gray-800 px-5 py-4 rounded-2xl mb-6 border border-gray-100 shadow-sm">
                      <div className="flex items-center gap-1.5 mb-1.5 text-indigo-600 font-extrabold text-[13px]">
                        <IconStar className="w-4 h-4" /> 나의 숨겨진 슈퍼파워
                      </div>
                      <p className="text-[13px] leading-relaxed break-keep font-semibold">
                        {resultData.superpower}
                      </p>
                    </div>

                    <div className="flex flex-wrap items-center justify-center gap-2 mb-6 text-[13px] font-bold text-gray-600">
                      <span className="text-yellow-500"><IconStar className="w-4 h-4" /></span>
                      내 안의 부캐: 
                      <button 
                        onClick={() => setShowSecondaryModal(true)}
                        className={`flex items-center gap-1 px-2.5 py-1 rounded-md text-white font-extrabold ${secondaryData.color} hover:scale-105 hover:shadow-md transition cursor-pointer`}
                        title="클릭해서 부캐 설명 보기"
                      >
                        {secondaryData.title.split(',')[1]} <span className="text-[10px] opacity-80">🔍</span>
                      </button>
                      {primaryScore - secondaryScore <= 2 && <span className="text-indigo-500 text-[11px] bg-indigo-50 px-2 rounded-full border border-indigo-100">비등비등!</span>}

                  </div>

                  <div>
                    <p className="text-gray-600 text-[14px] leading-relaxed break-keep text-left bg-gray-50 p-5 rounded-2xl mb-0 border border-gray-100">
                      {resultData.description}

                  </div>
                </div>

                {/* 우측 패널 */}
                <div className="flex flex-col gap-6">
                  
                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-white border-b-4 border-blue-400 rounded-3xl p-5 text-center shadow-sm">
                      <div className="flex justify-center mb-2"><IconZap className="w-6 h-6 text-blue-500" /></div>
                      <p className="text-[12px] font-bold text-blue-600 mb-1">시너지 폭발 짝꿍</p>
                      <p className="text-[15px] font-extrabold text-gray-800 break-keep">{RESULTS[resultData.bestMatch].title.split(',')[1]}</p>
                    </div>
                    <div className="bg-white border-b-4 border-orange-400 rounded-3xl p-5 text-center shadow-sm">
                      <div className="flex justify-center mb-2"><IconPuzzle className="w-6 h-6 text-orange-500" /></div>
                      <p className="text-[12px] font-bold text-orange-600 mb-1">이해가 필요한 짝꿍</p>
                      <p className="text-[15px] font-extrabold text-gray-800 break-keep">{RESULTS[resultData.badMatch].title.split(',')[1]}</p>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-6 shadow-sm">
                    <h3 className="text-[14px] font-extrabold text-gray-800 mb-5 text-center">나의 에고그램 밸런스</h3>
                    <div className="space-y-3.5">
                      {Object.entries(finalScores).map(([trait, score]) => {
                        const percentage = (score / 30) * 100; 
                        const label = trait === 'CP' ? '통제/원칙 (CP)' :
                                      trait === 'NP' ? '배려/양육 (NP)' :
                                      trait === 'A'  ? '논리/분석 (A)' :
                                      trait === 'FC' ? '자유/창의 (FC)' : '순응/협조 (AC)';
                        
                        return (
                          <div key={trait} className="flex items-center gap-4">
                            <span className="w-24 text-[12px] font-bold text-gray-500 text-right">{label}</span>
                            <div className="flex-1 bg-gray-100 rounded-full h-3.5">
                              <div 
                                className={`h-3.5 rounded-full transition-all duration-1000 ease-out ${primary === trait ? resultData.color : 'bg-gray-400'}`}
                                style={{ width: `${percentage}%` }}
                              ></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* ✨ 3번 추가: +1 혜택 */}
                  <div className="bg-yellow-50 rounded-3xl p-5 shadow-sm border border-yellow-200">
                    <div className="flex items-center gap-2 mb-2 text-yellow-700 font-extrabold text-[14px]">
                      <IconGift className="w-5 h-5" /> 나와 함께하면 얻는 [+1 혜택]
                    </div>
                    <p className="text-[14px] font-bold text-gray-800 break-keep leading-relaxed pl-7">
                      {resultData.perk}
                    </p>
                  </div>

                  <div className="bg-white rounded-3xl p-6 text-[14px] flex gap-4 shadow-sm border-l-[6px] border-indigo-500 h-full">
                    <IconShieldAlert className="w-7 h-7 flex-shrink-0 text-indigo-500 mt-1" />
                    <div className="w-full">
                      <p className="font-extrabold mb-4 text-[16px] text-gray-800">나랑 일할 땐 이렇게 해줘요!</p>
                      <ul className="space-y-3">
                        {resultData.tip.map((t, idx) => (
                          <li key={idx} className="flex items-start gap-2 break-keep leading-relaxed text-gray-700 font-medium">
                            <span className="text-indigo-400 font-bold mt-0.5">✓</span>
                            <span>{t}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row w-full max-w-xl gap-2 sm:gap-3 mt-6 px-2">
              <button 
                onClick={handleCapture}
                disabled={isCapturing}
                className={`w-full sm:w-auto sm:flex-1 font-bold py-4 px-3 sm:px-4 rounded-2xl flex items-center justify-center gap-2 transition duration-200 text-sm sm:text-base ${
                  isCapturing ? 'bg-indigo-300 text-white cursor-not-allowed' : 'bg-gray-900 text-white hover:bg-gray-800 shadow-xl shadow-gray-300 hover:-translate-y-1'
                }`}
              >
                {isCapturing ? <><IconCamera className="w-4 h-4 sm:w-5 sm:h-5 animate-pulse" /> 캡쳐 중...</> : <><IconCamera className="w-4 h-4 sm:w-5 sm:h-5" /> 캡쳐하기</>}
              </button>
              
              <div className="flex gap-2 sm:gap-3 w-full sm:w-auto sm:flex-1">
                <button 
                  onClick={() => setShowReview(true)}
                  className="flex-1 font-bold py-4 px-2 sm:px-3 rounded-2xl flex items-center justify-center gap-1.5 bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition shadow-sm hover:-translate-y-1 text-[13px] sm:text-sm whitespace-nowrap"
                >
                  <IconList className="w-4 h-4 sm:w-5 sm:h-5" /> 답변
                </button>

                <button 
                  onClick={() => setShowAllTypesModal(true)}
                  className="flex-1 font-bold py-4 px-2 sm:px-3 rounded-2xl flex items-center justify-center gap-1.5 bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition shadow-sm hover:-translate-y-1 text-[13px] sm:text-sm whitespace-nowrap"
                >
                  <IconUsers className="w-4 h-4 sm:w-5 sm:h-5" /> 다른 성향
                </button>

                <button 
                  onClick={handleStart}
                  className="w-14 sm:w-16 flex-shrink-0 flex items-center justify-center bg-white hover:bg-gray-50 text-gray-700 rounded-2xl transition shadow-md border border-gray-200"
                  aria-label="다시하기"
                >
                  <IconRotateCcw className="w-5 h-5" />
                </button>
              </div>
            </div>

            {showSecondaryModal && (
              <div className="fixed inset-0 bg-black bg-opacity-40 z-[60] flex items-center justify-center p-4 animate-fade-in backdrop-blur-sm">
                <div className="bg-white rounded-[2rem] w-full max-w-sm flex flex-col shadow-2xl relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-4">
                    <button 
                      onClick={() => setShowSecondaryModal(false)}
                      className="p-2 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-600 transition"
                    >
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>
                  <div className="p-8 flex flex-col items-center text-center mt-2">
                    <h3 className="text-gray-500 font-bold mb-4 text-[12px] tracking-wider bg-gray-100 px-4 py-1.5 rounded-full">
                      나의 두 번째 성향 (부캐)
                    </h3>
                    <div className={`p-5 rounded-3xl ${secondaryData.color} bg-opacity-10 shadow-inner mb-5`}>
                      {secondaryData.icon}
                    </div>
                    <h2 className="text-xl sm:text-2xl font-extrabold text-gray-900 mb-4">{secondaryData.title}</h2>
                    <div className="bg-gray-50 p-5 rounded-xl text-[14px] leading-relaxed break-keep text-gray-600 border border-gray-100">
                      {secondaryData.description}
                    </div>
                    <button 
                      onClick={() => setShowSecondaryModal(false)}
                      className="mt-6 w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg"
                    >
                      확인
                    </button>
                  </div>
                </div>
              </div>
            )}

            {showAllTypesModal && (
              <div className="fixed inset-0 bg-black bg-opacity-40 z-[60] flex items-center justify-center p-4 animate-fade-in backdrop-blur-sm">
                <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl relative overflow-hidden">
                  <div className="p-6 sm:p-8 border-b border-gray-100 flex justify-between items-center bg-white z-10 relative">
                    <div>
                      <h3 className="text-xl sm:text-2xl font-extrabold text-gray-900">전체 팀 프로젝트 캐릭터</h3>
                      <p className="text-sm text-gray-500 mt-1">우리 팀에는 어떤 성향들이 있을까요?</p>
                    </div>
                    <button 
                      onClick={() => setShowAllTypesModal(false)}
                      className="p-2 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-600 transition"
                    >
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>
                  <div className="overflow-y-auto p-4 sm:p-8 space-y-4 bg-gray-50 rounded-b-[2rem]">
                    {Object.values(RESULTS).map((type, idx) => (
                      <div key={idx} className="bg-white p-5 sm:p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6">
                        <div className={`p-4 rounded-2xl ${type.color} bg-opacity-10 shrink-0 self-center`}>
                          {type.icon}
                        </div>
                        <div className="flex-1 text-center sm:text-left">
                          <h4 className="font-extrabold text-gray-800 text-lg sm:text-xl mb-1">{type.title}</h4>
                          <p className="text-sm font-bold text-indigo-500 mb-2">🎯 {type.pblRole}</p>
                          <p className="text-[13px] sm:text-sm text-gray-600 break-keep leading-relaxed">{type.description}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      };

      return (
        <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 sm:p-8 font-sans selection:bg-indigo-200 relative">
          <div className={`bg-white w-full rounded-[2.5rem] shadow-2xl shadow-indigo-100/50 p-4 sm:p-8 min-h-[650px] flex flex-col items-center justify-center relative overflow-hidden transition-all duration-500 ${step === 'result' ? 'max-w-4xl' : 'max-w-xl'}`}>
            {step === 'intro' && renderIntro()}
            {step === 'test' && renderTest()}
            {step === 'result' && renderResult()}
            
            <div className="absolute top-0 right-0 -mr-20 -mt-20 w-48 h-48 rounded-full bg-indigo-50 blur-3xl -z-10 pointer-events-none"></div>
            <div className="absolute bottom-0 left-0 -ml-20 -mb-20 w-48 h-48 rounded-full bg-pink-50 blur-3xl -z-10 pointer-events-none"></div>
          </div>

          {showReview && (
            <div className="fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 animate-fade-in backdrop-blur-sm">
              <div className="bg-white rounded-[2rem] w-full max-w-lg max-h-[85vh] flex flex-col shadow-2xl">
                <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                  <div>
                    <h3 className="text-xl font-extrabold text-gray-900">내 답변 돌아보기</h3>
                    <p className="text-sm text-gray-500 mt-1">내가 선택한 답변들을 확인해보세요.</p>
                  </div>
                  <button 
                    onClick={() => setShowReview(false)}
                    className="p-2 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-600 transition"
                  >
                    <IconX className="w-5 h-5" />
                  </button>
                </div>
                
                <div className="overflow-y-auto p-6 space-y-4 bg-gray-50 rounded-b-[2rem]">
                  {selectedAnswers.map((ans, i) => {
                    if (!ans) return null;
                    return (
                      <div key={i} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <div className="flex gap-3 items-start">
                          <span className="text-indigo-500 font-extrabold text-sm mt-0.5">Q{i + 1}.</span>
                          <div>
                            <p className="text-[14px] font-semibold text-gray-800 break-keep leading-relaxed mb-3">
                              {QUESTIONS[i].text}
                            </p>
                            <div className="inline-block bg-indigo-50 text-indigo-700 text-[13px] font-bold px-3 py-1.5 rounded-lg border border-indigo-100">
                              {ans.text}
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
