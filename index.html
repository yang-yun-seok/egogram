          "본론으로 들어가기 전, '주말 잘 보내셨어요?' 같은 가벼운 스몰토크가 큰 힘이 돼요.",
          "팀원 간의 차가운 피드백이 오갈 때 스트레스를 받습니다. 둥글게 말하는 쿠션어를 사용해 주세요.",
          "제가 도와준 일에 대해 진심 어린 '고마워요!' 한마디면 밤샘 작업도 거뜬합니다."
        ]
      },
      A: {
        title: "팀의 네비게이션, 냉철한 팩트폭격기",

        color: "bg-blue-500",
        pblRole: "자료 조사 및 분석 / 논리적 판단 / 기획",
        description: "자료 분석과 논리적 판단을 통해 계획을 수립하는 브레인입니다. 감정에 휩쓸리지 않고 객관적 근거를 바탕으로 해결책을 제시합니다.",
        caution: "팩트 위주라 감정적인 소통이 다소 부족해 보일 수 있어요. (⚠️ 같은 A만 모이면 활동성이 낮고 분위기가 너무 딱딱해질 수 있어요!)",
        extremeWarning: "논리와 이성이 극에 달했습니다! 팩트 폭격이 너무 강해 팀원들이 마음에 상처를 입고 입을 닫을 수 있습니다. 가끔은 데이터보다 '공감의 한마디'가 더 큰 효율을 냅니다.",
        catchphrase: "그 주장을 뒷받침할 데이터가 있나요?",
        bestMatch: "CP", 
        badMatch: "NP",  
        tip: [
          "문제 상황을 공유할 때는 '감정'보다 '사실(What, Why, How)' 위주로 정리해서 말씀해 주세요.",
          "뒷받침할 데이터나 레퍼런스를 가져와 주시면 빠르게 설득됩니다.",
          "회의는 목적과 아젠다가 명확할 때 가장 즐겁습니다. 의식의 흐름대로 진행되는 회의는 지쳐요."
        ]
      },
      FC: {
        title: "팀의 스파크, 자유로운 아이디어 뱅크",
        icon: <IconSparkles className="w-12 h-12 text-yellow-500" />,
        color: "bg-yellow-500",
        pblRole: "아이디어 제안 / 창의적 시도 / 발표",
        description: "자유롭게 아이디어를 제안하고 창의적인 시도를 즐기는 분위기 메이커입니다. 엉뚱하지만 기발한 발상으로 팀에 강력한 활력을 불어넣습니다.",
        caution: "다소 산만해 보이거나 일의 마무리가 약할 수 있어요. (⚠️ 같은 FC만 모이면 아이디어는 넘치지만 결과물이 안 나올 수 있어요!)",
        extremeWarning: "자유로움과 즉흥성이 극에 달했습니다! 통통 튀는 생각도 좋지만, 현실적인 제약과 팀의 룰을 무시하면 팀원들의 인내심이 바닥날 수 있습니다. 일의 마무리에 집중해 주세요.",
        catchphrase: "아! 갑자기 재밌는 생각 났어요!",
        bestMatch: "NP", 
        badMatch: "CP",  
        tip: [
          "엉뚱한 아이디어라도 '오, 재밌겠는데요?'라며 리액션해 주시면 더 좋은 아이디어가 폭발해요.",
          "너무 빡빡한 마이크로 매니징보다는, 큰 방향성만 주고 자율적으로 일할 수 있게 맡겨주세요.",
          "칭찬과 인정은 저의 원동력입니다! 공개적인 칭찬은 저를 춤추게 합니다."
        ]
      },
      AC: {
        title: "팀의 윤활유, 평화주의자 조율러",
        icon: <IconUsers className="w-12 h-12 text-green-500" />,
        color: "bg-green-500",
        pblRole: "자료 정리 / 지시 이행 / 안정적 지원",
        description: "타인을 배려하며 지시를 잘 이행하는 든든한 조력자입니다. 눈에 띄게 나서지는 않지만, 안정적으로 참여하여 프로젝트가 부드럽게 굴러가게 합니다.",
        caution: "너무 수동적이거나 자신의 의견 제시가 적을 수 있어요. (⚠️ 같은 AC만 모이면 서로 눈치만 보고 아이디어가 부족할 수 있어요!)",
        extremeWarning: "순응과 양보가 극에 달했습니다! 갈등을 피하려다 무조건 참기만 하면 무임승차자들의 타겟이 되거나 혼자 곪아 터질 수 있습니다. 팀을 위해 명확하게 '내 의견'을 말할 용기가 필요합니다.",
        catchphrase: "네, 저는 다 좋아요. 편하신 대로 맞춰주세요.",
        bestMatch: "CP", 
        badMatch: "A",   
        tip: [
          "회의 때 제가 조용하다면, 듣고 정리하는 중일 확률이 높아요. 'ㅇㅇ님 생각은 어때요?'라고 부드럽게 짚어주세요.",
          "누군가 혼자 책임을 다 떠안거나 소외되는 상황을 견디기 힘들어해요. 모두가 1인분을 하는 밸런스를 중시합니다.",
          "의견이 충돌할 때, 강압적으로 밀어붙이기보다 '우리 이런 방향으로 타협해보면 어떨까요?'라며 제안해 주세요."
        ]
      }
    };

    function App() {
      const [step, setStep] = useState('intro'); // intro, test, result
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [scores, setScores] = useState({ CP: 0, NP: 0, A: 0, FC: 0, AC: 0 });
      const [isCapturing, setIsCapturing] = useState(false);
      const [isTransitioning, setIsTransitioning] = useState(false);
      
      const [name, setName] = useState('');
      const [userAnswers, setUserAnswers] = useState([]);
      const [showReview, setShowReview] = useState(false);

      // 폭죽 애니메이션 효과
      useEffect(() => {
        if (step === 'result' && window.confetti) {
          window.confetti({
            particleCount: 150,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#6366f1', '#ec4899', '#3b82f6', '#eab308', '#22c55e']
          });
        }
      }, [step]);

      const handleStart = () => {
        setStep('test');
        setScores({ CP: 0, NP: 0, A: 0, FC: 0, AC: 0 });
        setCurrentQuestion(0);
        setUserAnswers([]);
        setShowReview(false);
        setIsTransitioning(false);
        setName(''); // 다시하기 시 이전 캡쳐 잔상 방지를 위해 이름도 완전 초기화
      };

      const handleAnswer = (answerObj) => {
        if (isTransitioning) return;
        setIsTransitioning(true);

        const category = QUESTIONS[currentQuestion].category;
        
        setScores(prev => ({ ...prev, [category]: prev[category] + answerObj.score }));
        
        setUserAnswers(prev => [...prev, {
          question: QUESTIONS[currentQuestion].text,
          answerText: answerObj.text
        }]);

        if (currentQuestion < QUESTIONS.length - 1) {
          setTimeout(() => {
            setCurrentQuestion(prev => prev + 1);
            setIsTransitioning(false);
          }, 150);
        } else {
          setTimeout(() => {
            setStep('result');
            setIsTransitioning(false);
          }, 400);
        }
      };

      // 1위, 2위 성향 모두 추출하도록 수정
      const getRankedTraits = () => {
        // 객체를 배열로 변환 후 점수순 내림차순 정렬
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        return {
          primary: sorted[0][0],   // 1위 성향 (본캐)
          secondary: sorted[1][0]  // 2위 성향 (부캐)
        };
      };

      const handleCapture = async () => {
        if (!window.html2canvas) {
          alert("캡쳐 기능을 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
          return;
        }
        
        const captureArea = document.getElementById('result-capture-area');
        if (captureArea) {
          setIsCapturing(true);
          try {
            // 이전 상태가 캡쳐되는 현상을 막기 위해 딜레이 시간을 500ms로 늘리고 옵션 강화
            await new Promise(resolve => setTimeout(resolve, 500));
            
            const canvas = await window.html2canvas(captureArea, {
              scale: 2, 
              backgroundColor: '#f3f4f6', 
              windowWidth: captureArea.scrollWidth,
              useCORS: true, // 외부 리소스 로드 최적화
              logging: false
            });
            
            const image = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.href = image;
            link.download = `나의_팀워크_에고그램.png`;
            link.click();
          } catch (error) {
            console.error("캡쳐 오류:", error);
            alert("이미지 캡쳐에 실패했습니다.");
          } finally {
            setIsCapturing(false);
          }
        }
      };

      const renderIntro = () => (
        <div className="flex flex-col items-center justify-center text-center animate-fade-in space-y-6 py-8 w-full">
          <div className="bg-indigo-100 p-5 rounded-full mb-2 shadow-inner">
            <IconUsers className="w-16 h-16 text-indigo-600" />
          </div>
          <h1 className="text-4xl sm:text-5xl font-extrabold text-gray-800 break-keep leading-tight">
            에고그램 테스트
          </h1>
          <p className="text-gray-600 mb-4 max-w-md break-keep leading-relaxed px-4">
            총 30개의 질문으로 나의 팀 내 포지션과 소통 꿀팁, 그리고 케미를 알아봅니다.
          </p>
          
          <div className="w-full max-w-xs mt-2 mb-2">
            <input
              type="text"
              placeholder="이름 입력 (선택사항)"
              value={name}
              onChange={(e) => setName(e.target.value)}
              className="w-full px-5 py-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center font-semibold text-gray-700 bg-white shadow-inner placeholder-gray-400 transition"
              maxLength="10"
            />
          </div>

          <button 
            onClick={handleStart}
            className="w-full max-w-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-2xl shadow-xl shadow-indigo-200 transition transform hover:-translate-y-1 hover:scale-105 flex items-center justify-center gap-2 text-lg mt-2"
          >
            테스트 시작하기 <IconArrowRight className="w-5 h-5" />
          </button>
        </div>
      );

      const renderTest = () => {
        const question = QUESTIONS[currentQuestion];
        if (!question) return null;

        const progress = ((currentQuestion + 1) / QUESTIONS.length) * 100;
        
        return (
          <div className="w-full max-w-md animate-fade-in flex flex-col h-full justify-between py-2">
            <div className="space-y-6">
              <div className="space-y-2 px-2">
                <div className="flex justify-between text-sm font-bold text-indigo-500">
                  <span>진행도</span>
                  <span>{currentQuestion + 1} <span className="text-gray-400 font-medium">/ {QUESTIONS.length}</span></span>
                </div>
                <div className="w-full bg-indigo-100 rounded-full h-3">
                  <div 
                    className="bg-indigo-500 h-3 rounded-full transition-all duration-300 ease-out" 
                    style={{ width: `${progress}%` }}
                  ></div>
                </div>
              </div>

              <div className="bg-white rounded-3xl shadow-md border border-indigo-50 p-8 min-h-[180px] flex items-center justify-center text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-1 bg-indigo-500 opacity-20"></div>
                <h2 className="text-xl font-bold text-gray-800 break-keep leading-relaxed relative z-10">
                  <span className="text-indigo-300 text-4xl absolute -top-4 -left-4 opacity-50">"</span>
                  {question.text}
                  <span className="text-indigo-300 text-4xl absolute -bottom-6 -right-4 opacity-50">"</span>
                </h2>
              </div>
            </div>

            <div className="space-y-3 mt-8">
              {ANSWERS.map((answer, idx) => (
                <button
                  key={idx}
                  onClick={() => handleAnswer(answer)}
                  disabled={isTransitioning}
                  className={`w-full font-bold py-4 px-6 rounded-2xl transition-all duration-200 flex justify-center text-lg active:scale-[0.98] shadow-sm ${
                    isTransitioning 
                    ? 'bg-gray-50 text-gray-400 border border-gray-100 cursor-not-allowed shadow-none' 
                    : 'bg-white hover:bg-indigo-50 border border-gray-200 hover:border-indigo-300 text-gray-700 hover:text-indigo-700'
                  }`}
                >
                  {answer.text}
                </button>
              ))}
            </div>
          </div>
        );
      };

      const renderResult = () => {
        const { primary, secondary } = getRankedTraits();
        const resultData = RESULTS[primary];
        const secondaryData = RESULTS[secondary]; // 부캐(2순위) 데이터
        
        const primaryScore = scores[primary];
        const secondaryScore = scores[secondary];
        
        const isExtreme = primaryScore >= 28; 
        const displayName = name.trim() ? `${name.trim()}님` : '당신';

        return (
          <div className="w-full flex flex-col items-center animate-fade-in pb-4">
            
            {/* --- 캡쳐 영역 시작 --- */}
            <div id="result-capture-area" className="w-full flex flex-col items-center bg-gray-100 p-4 sm:p-8 rounded-[2.5rem]">
              <h2 className="text-gray-500 font-bold mb-6 text-center text-sm tracking-wider bg-white px-5 py-2 rounded-full shadow-sm">
                {displayName}의 팀 프로젝트 캐릭터는
              </h2>
              
              <div className="w-full grid grid-cols-1 md:grid-cols-2 gap-6">
                
                {/* 좌측 패널: 캐릭터 핵심 정보 */}
                <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="flex justify-center mb-6">
                      <div className={`p-6 rounded-3xl ${resultData.color} bg-opacity-10 shadow-inner relative`}>
                        {resultData.icon}
                      </div>
                    </div>
                    <h1 className="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-6 text-center break-keep leading-tight">
                      {resultData.title}
                    </h1>

                    <div className="flex justify-center mb-6">
                      <div className="inline-flex items-center gap-2 bg-gray-50 border border-gray-100 px-5 py-2.5 rounded-full">
                        <IconMessageCircle className="w-4 h-4 text-gray-500" />
                        <span className="text-[13px] font-semibold text-gray-700">말버릇: <span className="text-indigo-600">"{resultData.catchphrase}"</span></span>
                      </div>
                    </div>

                    <div className="bg-indigo-50 text-indigo-900 px-5 py-4 rounded-2xl mb-5 border border-indigo-100 text-sm font-bold text-center">
                      🎯 추천 역할 : <span className="text-indigo-600">{resultData.pblRole}</span>
                    </div>

                    {/* ✨ 내 안의 부캐 (2순위) 표시 영역 - 새롭게 추가됨 */}
                    <div className="flex items-center justify-center gap-2 mb-6 text-[13px] font-bold text-gray-600">
                      <span className="text-yellow-500"><IconStar className="w-4 h-4" /></span>
                      내 안의 부캐: <span className={`px-2 py-0.5 rounded text-white ${secondaryData.color}`}>{secondaryData.title.split(',')[1]}</span>
                      {primaryScore - secondaryScore <= 2 && <span className="text-indigo-500 text-[11px] bg-indigo-50 px-2 rounded-full ml-1">비등비등!</span>}
                    </div>
                  </div>

                  <div>
                    <p className="text-gray-600 text-[14px] leading-relaxed break-keep text-left bg-gray-50 p-5 rounded-t-2xl mb-0 border-b border-gray-100">
                      {resultData.description}
                    </p>
                    <div className="bg-red-50 text-red-700 text-[13px] leading-relaxed break-keep text-left p-5 rounded-b-2xl border-t border-red-100">
                      <span className="font-bold">⚠️ 아쉬울 수 있는 점:</span> {resultData.caution}
                    </div>

                    {isExtreme && (
                      <div className="mt-4 bg-gray-900 text-gray-100 text-[13.5px] leading-relaxed break-keep text-left p-5 rounded-2xl border-l-4 border-red-500 shadow-lg relative overflow-hidden">
                        <div className="absolute top-0 right-0 -mt-2 -mr-2 text-red-500 opacity-20 transform rotate-12">
                          <IconShieldAlert className="w-16 h-16" />
                        </div>
                        <p className="font-extrabold text-red-400 mb-1.5 relative z-10 flex items-center gap-1.5">
                          <span className="animate-pulse">🚨</span> 밸런스 붕괴 주의보!
                        </p>
                        <p className="relative z-10">{resultData.extremeWarning}</p>
                      </div>
                    )}
                  </div>
                </div>

                {/* 우측 패널: 궁합, 그래프, 팁 */}
                <div className="flex flex-col gap-6">
                  
                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-white border-b-4 border-blue-400 rounded-3xl p-5 text-center shadow-sm">
                      <div className="flex justify-center mb-2"><IconZap className="w-6 h-6 text-blue-500" /></div>
                      <p className="text-[12px] font-bold text-blue-600 mb-1">시너지 폭발 짝꿍</p>
                      <p className="text-[15px] font-extrabold text-gray-800 break-keep">{RESULTS[resultData.bestMatch].title.split(',')[1]}</p>
                    </div>
                    <div className="bg-white border-b-4 border-orange-400 rounded-3xl p-5 text-center shadow-sm">
                      <div className="flex justify-center mb-2"><IconPuzzle className="w-6 h-6 text-orange-500" /></div>
                      <p className="text-[12px] font-bold text-orange-600 mb-1">이해가 필요한 짝꿍</p>
                      <p className="text-[15px] font-extrabold text-gray-800 break-keep">{RESULTS[resultData.badMatch].title.split(',')[1]}</p>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-6 shadow-sm">
                    <h3 className="text-[14px] font-extrabold text-gray-800 mb-5 text-center">나의 에고그램 밸런스</h3>
                    <div className="space-y-3.5">
                      {Object.entries(scores).map(([trait, score]) => {
                        const percentage = (score / 30) * 100; 
                        const label = trait === 'CP' ? '통제/원칙 (CP)' :
                                      trait === 'NP' ? '배려/양육 (NP)' :
                                      trait === 'A'  ? '논리/분석 (A)' :
                                      trait === 'FC' ? '자유/창의 (FC)' : '순응/협조 (AC)';
                        
                        return (
                          <div key={trait} className="flex items-center gap-4">
                            <span className="w-24 text-[12px] font-bold text-gray-500 text-right">{label}</span>
                            <div className="flex-1 bg-gray-100 rounded-full h-3.5">
                              <div 
                                className={`h-3.5 rounded-full transition-all duration-1000 ease-out ${primary === trait ? resultData.color : 'bg-gray-400'}`}
                                style={{ width: `${percentage}%` }}
                              ></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-6 text-[14px] flex gap-4 shadow-sm border-l-[6px] border-indigo-500 h-full">
                    <IconShieldAlert className="w-7 h-7 flex-shrink-0 text-indigo-500 mt-1" />
                    <div className="w-full">
                      <p className="font-extrabold mb-4 text-[16px] text-gray-800">나랑 일할 땐 이렇게 해줘요!</p>
                      <ul className="space-y-3">
                        {resultData.tip.map((t, idx) => (
                          <li key={idx} className="flex items-start gap-2 break-keep leading-relaxed text-gray-700 font-medium">
                            <span className="text-indigo-400 font-bold mt-0.5">✓</span>
                            <span>{t}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            {/* --- 캡쳐 영역 끝 --- */}

            {/* 액션 버튼 */}
            <div className="flex w-full max-w-xl gap-2 sm:gap-3 mt-6 px-2">
              <button 
                onClick={handleCapture}
                disabled={isCapturing}
                className={`flex-1 font-bold py-4 px-3 sm:px-4 rounded-2xl flex items-center justify-center gap-2 transition duration-200 text-sm sm:text-base ${
                  isCapturing ? 'bg-indigo-300 text-white cursor-not-allowed' : 'bg-gray-900 text-white hover:bg-gray-800 shadow-xl shadow-gray-300 hover:-translate-y-1'
                }`}
              >
                {isCapturing ? <><IconCamera className="w-4 h-4 sm:w-5 sm:h-5 animate-pulse" /> 캡쳐 중...</> : <><IconCamera className="w-4 h-4 sm:w-5 sm:h-5" /> 캡쳐하기</>}
              </button>
              
              <button 
                onClick={() => setShowReview(true)}
                className="flex-1 font-bold py-4 px-3 sm:px-4 rounded-2xl flex items-center justify-center gap-2 bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition shadow-sm hover:-translate-y-1 text-sm sm:text-base"
              >
                <IconList className="w-4 h-4 sm:w-5 sm:h-5" /> 답변 보기
              </button>

              <button 
                onClick={handleStart}
                className="w-14 sm:w-16 flex items-center justify-center bg-white hover:bg-gray-50 text-gray-700 rounded-2xl transition shadow-md border border-gray-200"
                aria-label="다시하기"
              >
                <IconRotateCcw className="w-5 h-5" />
              </button>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 sm:p-8 font-sans selection:bg-indigo-200 relative">
          <div className={`bg-white w-full rounded-[2.5rem] shadow-2xl shadow-indigo-100/50 p-4 sm:p-8 min-h-[650px] flex flex-col items-center justify-center relative overflow-hidden transition-all duration-500 ${step === 'result' ? 'max-w-4xl' : 'max-w-xl'}`}>
            {step === 'intro' && renderIntro()}
            {step === 'test' && renderTest()}
            {step === 'result' && renderResult()}
            
            {/* 장식용 배경 */}
            <div className="absolute top-0 right-0 -mr-20 -mt-20 w-48 h-48 rounded-full bg-indigo-50 blur-3xl -z-10 pointer-events-none"></div>
            <div className="absolute bottom-0 left-0 -ml-20 -mb-20 w-48 h-48 rounded-full bg-pink-50 blur-3xl -z-10 pointer-events-none"></div>
          </div>

          {/* 답변 돌아보기 모달 */}
          {showReview && (
            <div className="fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 animate-fade-in backdrop-blur-sm">
              <div className="bg-white rounded-[2rem] w-full max-w-lg max-h-[85vh] flex flex-col shadow-2xl">
                <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                  <div>
                    <h3 className="text-xl font-extrabold text-gray-900">내 답변 돌아보기</h3>
                    <p className="text-sm text-gray-500 mt-1">내가 선택한 답변들을 확인해보세요.</p>
                  </div>
                  <button 
                    onClick={() => setShowReview(false)}
                    className="p-2 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-600 transition"
                  >
                    <IconX className="w-5 h-5" />
                  </button>
                </div>
                
                <div className="overflow-y-auto p-6 space-y-4 bg-gray-50 rounded-b-[2rem]">
                  {userAnswers.map((item, i) => (
                    <div key={i} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                      <div className="flex gap-3 items-start">
                        <span className="text-indigo-500 font-extrabold text-sm mt-0.5">Q{i + 1}.</span>
                        <div>
                          <p className="text-[14px] font-semibold text-gray-800 break-keep leading-relaxed mb-3">
                            {item.question}
                          </p>
                          <div className="inline-block bg-indigo-50 text-indigo-700 text-[13px] font-bold px-3 py-1.5 rounded-lg border border-indigo-100">
                            {item.answerText}
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
